<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>PEDI GO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#000;--card:#121212;--line:#232323;--tx:#f4f4f4;--mut:#8c8c8c;--g:#00FF88;--red:#ff5c5c}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:96px}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;background:#000e;backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line);padding:12px 0}
header .wrap{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--g)}
.link{background:none;border:0;color:var(--mut);padding:6px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--mut);font-weight:600}
.tabs button.on{background:var(--g);color:#000;border-color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.neg img{width:100%;height:120px;object-fit:cover;display:block}
.neg .in{padding:12px}.neg h3{font-size:17px}
.meta{color:var(--mut);font-size:13px;margin-top:4px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#1d1d1d;color:var(--mut)}
.chip.ok{background:#00ff8822;color:var(--g)}.chip.no{background:#ff5c5c22;color:var(--red)}
.closed{opacity:.55}
.prod{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.prod:last-child{border:0}.prod img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.prod .t{flex:1}.prod .p{color:var(--g);font-weight:700;margin-top:2px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--g);background:none;color:var(--g);font-size:20px;line-height:1}
.qty span{min-width:18px;text-align:center;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#000f;border-top:1px solid var(--line);z-index:6}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#000;font-weight:800;font-size:16px}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.red{background:none;border:1px solid var(--red);color:var(--red);padding:10px;margin-top:10px}
.btn:disabled{opacity:.5}
input,textarea{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.auth{padding-top:12vh}.auth h1{font-size:40px;letter-spacing:-1.5px;margin-bottom:6px}.auth h1 b{color:var(--g)}
.auth p{color:var(--mut);margin-bottom:22px}
.sheet{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:flex-end}
.sheet>div{background:#0d0d0d;border-top:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:520px;margin:0 auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.row{display:flex;justify-content:space-between;padding:4px 0}
.tot{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--g);color:#000;padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:90%;text-align:center}
.toast.err{background:var(--red);color:#fff}
.empty{color:var(--mut);text-align:center;padding:40px 0}
.back{background:none;border:0;color:var(--g);font-weight:700;padding:8px 0}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .2s}@keyframes in{from{opacity:0;transform:translate(-50%,-8px)}}}
</style></head>
<body><div id="app"></div>
<script>
// ====== CONFIGURACIÓN: reemplazá estas dos líneas con los datos de tu proyecto Supabase ======
const SUPABASE_URL='https://wnivydpyoqqvkxufuudq.supabase.co', SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InduaXZ5ZHB5b3Fxdmt4dWZ1dWRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNDYxMTQsImV4cCI6MjEwODYyMjExNH0.78HBLsvlJ9SXNxWuPsBSZtld3eQU5LGiL27ef1jzfeA';
// ===========================================================================================
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById('app');
const money=n=>'$'+Number(n||0).toLocaleString('es-AR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ESTADOS={pendiente:'Esperando al negocio',aceptado:'Aceptado',preparando:'En preparación',listo:'Listo, buscando cadete',en_camino:'En camino',entregado:'Entregado',rechazado:'Rechazado',cancelado:'Cancelado'};
let me=null,tab='negocios',cart={},neg=null,prods=[],ch=null;

function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  session?load():authView();
  sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT'){me=null;authView()}});
}

function authView(reg){
  app.innerHTML=`<div class="wrap auth"><h1>PEDI <b>GO</b></h1><p>${reg?'Creá tu cuenta para pedir':'Pedí a tu comercio de siempre'}</p>
  ${reg?'<input id="nom" placeholder="Nombre y apellido" autocomplete="name"><input id="tel" placeholder="Teléfono" type="tel" autocomplete="tel">':''}
  <input id="em" placeholder="Email" type="email" autocomplete="email"><input id="pw" placeholder="Contraseña (mínimo 6)" type="password" autocomplete="${reg?'new-password':'current-password'}">
  <button class="btn" id="go">${reg?'Crear cuenta':'Entrar'}</button>
  <button class="btn sec" style="margin-top:10px" id="sw">${reg?'Ya tengo cuenta':'Crear una cuenta'}</button></div>`;
  document.getElementById('sw').onclick=()=>authView(!reg);
  document.getElementById('go').onclick=async e=>{
    const b=e.target,v=id=>(document.getElementById(id)?.value||'').trim();
    if(!v('em')||v('pw').length<6)return toast('Completá email y una contraseña de 6 o más caracteres',1);
    if(reg&&!v('nom'))return toast('Falta tu nombre',1);
    b.disabled=true;
    const r=reg?await sb.auth.signUp({email:v('em'),password:v('pw'),options:{data:{nombre:v('nom'),telefono:v('tel')}}})
               :await sb.auth.signInWithPassword({email:v('em'),password:v('pw')});
    b.disabled=false;
    if(r.error)return toast(r.error.message==='Invalid login credentials'?'Email o contraseña incorrectos':r.error.message,1);
    if(!r.data.session)return toast('Revisá tu email para confirmar la cuenta');
    load();
  };
}

async function load(){
  const {data:{user}}=await sb.auth.getUser();
  const {data,error}=await sb.from('perfiles').select('*').eq('id',user.id).single();
  if(error||!data){toast('No pudimos cargar tu perfil',1);return authView()}
  me=data;
  me.rol==='CLIENTE'?clientShell():otherRole();
}

function otherRole(){
  app.innerHTML=`<div class="wrap auth"><h1>PEDI <b>GO</b></h1><p>Entraste como ${esc(me.rol)}. Esta pantalla se arma en los próximos pasos.</p><button class="btn sec" onclick="salir()">Cerrar sesión</button></div>`;
}
async function salir(){cart={};await sb.auth.signOut()}

function clientShell(){
  app.innerHTML=`<header><div class="wrap"><div class="logo">PEDI <b>GO</b></div><button class="link" onclick="salir()">Salir</button></div></header>
  <div class="wrap"><div class="tabs"><button id="t1" onclick="setTab('negocios')">Comercios</button><button id="t2" onclick="setTab('pedidos')">Mis pedidos</button></div><div id="main"></div></div><div id="cartbar"></div>`;
  if(ch)sb.removeChannel(ch);
  ch=sb.channel('mis-pedidos').on('postgres_changes',{event:'*',schema:'public',table:'pedidos'},()=>{if(tab==='pedidos')renderPedidos()}).subscribe();
  setTab('negocios');
}
function setTab(t){
  tab=t;neg=null;
  document.getElementById('t1').className=t==='negocios'?'on':'';
  document.getElementById('t2').className=t==='pedidos'?'on':'';
  t==='negocios'?renderNegocios():renderPedidos();
  renderBar();
}

async function renderNegocios(){
  const m=document.getElementById('main');m.innerHTML='<div class="empty">Cargando…</div>';
  const {data,error}=await sb.from('negocios').select('*').eq('activo',true).order('abierto',{ascending:false}).order('rating',{ascending:false});
  if(error)return m.innerHTML='<div class="empty">No pudimos cargar los comercios. Probá de nuevo.</div>';
  if(!data.length)return m.innerHTML='<div class="empty">Todavía no hay comercios en tu ciudad.</div>';
  m.innerHTML=data.map(n=>`<div class="card neg ${n.abierto?'':'closed'}" onclick="openNegocio('${n.id}')">
    ${n.foto_url?`<img src="${esc(n.foto_url)}" alt="" loading="lazy">`:''}
    <div class="in"><div class="row"><h3>${esc(n.nombre)}</h3><span class="chip ${n.abierto?'ok':'no'}">${n.abierto?'Abierto':'Cerrado'}</span></div>
    <div class="meta">${esc(n.rubro)} · ${n.rating} ★ · ${n.tiempo_estimado_min} min · Envío ${money(n.costo_envio)}</div></div></div>`).join('');
}

async function openNegocio(id){
  const m=document.getElementById('main');m.innerHTML='<div class="empty">Cargando…</div>';
  const [a,b]=await Promise.all([sb.from('negocios').select('*').eq('id',id).single(),sb.from('productos').select('*').eq('negocio_id',id).eq('disponible',true).order('nombre')]);
  if(a.error||b.error)return toast('No pudimos abrir el comercio',1);
  if(neg&&neg.id!==id)cart={};
  if(!neg||neg.id!==id)cart={};
  neg=a.data;prods=b.data;
  m.innerHTML=`<button class="back" onclick="setTab('negocios')">Volver a los comercios</button>
  <h2 style="margin:4px 0">${esc(neg.nombre)}</h2><div class="meta" style="margin-bottom:12px">${esc(neg.descripcion||'')}${neg.abierto?'':' · Cerrado por ahora'}</div>
  <div class="card">${prods.map(p=>`<div class="prod"><img src="${esc(p.foto_url||neg.foto_url||'')}" alt=""><div class="t"><div>${esc(p.nombre)}</div><div class="meta">${esc(p.descripcion||'')}</div><div class="p">${money(p.precio)}</div></div>
  <div class="qty"><button aria-label="Quitar" onclick="chg('${p.id}',-1)">−</button><span id="q${p.id}">${cart[p.id]||0}</span><button aria-label="Agregar" onclick="chg('${p.id}',1)">+</button></div></div>`).join('')||'<div class="empty">Sin productos por ahora.</div>'}</div>`;
  renderBar();
}
function chg(id,d){
  const n=Math.max(0,Math.min(50,(cart[id]||0)+d));
  n?cart[id]=n:delete cart[id];
  const el=document.getElementById('q'+id);if(el)el.textContent=n;
  renderBar();
}
const subtotal=()=>prods.reduce((s,p)=>s+p.precio*(cart[p.id]||0),0);
const cantidad=()=>Object.values(cart).reduce((s,n)=>s+n,0);
function renderBar(){
  const b=document.getElementById('cartbar');if(!b)return;
  b.innerHTML=neg&&cantidad()?`<div class="bar"><button class="btn" onclick="checkout()">Ver pedido · ${cantidad()} · ${money(subtotal())}</button></div>`:'';
}

function checkout(){
  if(!neg.abierto)return toast('El comercio está cerrado por ahora',1);
  const items=prods.filter(p=>cart[p.id]);
  const s=document.createElement('div');s.className='sheet';s.id='sheet';
  s.innerHTML=`<div><h3 style="margin-bottom:10px">Tu pedido en ${esc(neg.nombre)}</h3>
  ${items.map(p=>`<div class="row"><span>${cart[p.id]} × ${esc(p.nombre)}</span><span>${money(p.precio*cart[p.id])}</span></div>`).join('')}
  <div class="row meta"><span>Envío</span><span>${money(neg.costo_envio)}</span></div>
  <div class="row tot"><span>Total</span><span>${money(subtotal()+Number(neg.costo_envio))}</span></div>
  <div style="margin-top:14px"><input id="dir" placeholder="Dirección de entrega (calle y número)" value="${esc(localStorage.getItem('pg_dir')||'')}" autocomplete="street-address">
  <textarea id="nota" rows="2" placeholder="Aclaraciones para el comercio (opcional)"></textarea>
  <div class="meta" style="margin-bottom:12px">Pagás en efectivo al recibir.</div>
  <button class="btn" id="conf">Confirmar pedido</button><button class="btn sec" style="margin-top:8px" onclick="document.getElementById('sheet').remove()">Seguir mirando</button></div></div>`;
  document.body.appendChild(s);
  document.getElementById('conf').onclick=async e=>{
    const dir=document.getElementById('dir').value.trim();
    if(!dir)return toast('Falta la dirección de entrega',1);
    e.target.disabled=true;
    const {error}=await sb.rpc('crear_pedido',{p_negocio:neg.id,p_items:items.map(p=>({producto_id:p.id,cantidad:cart[p.id]})),p_direccion:dir,p_pago:'efectivo',p_nota:document.getElementById('nota').value});
    if(error){e.target.disabled=false;return toast(error.message,1)}
    try{localStorage.setItem('pg_dir',dir)}catch(_){}
    s.remove();cart={};toast('Pedido enviado al comercio');setTab('pedidos');
  };
}

async function renderPedidos(){
  const m=document.getElementById('main');if(!m)return;
  const {data,error}=await sb.from('pedidos').select('*, negocios(nombre)').eq('cliente_id',me.id).order('created_at',{ascending:false}).limit(30);
  if(error)return m.innerHTML='<div class="empty">No pudimos cargar tus pedidos.</div>';
  if(!data.length)return m.innerHTML='<div class="empty">Todavía no hiciste pedidos. Elegí un comercio y armá el primero.</div>';
  m.innerHTML=data.map(p=>{
    const fin=['entregado','rechazado','cancelado'].includes(p.estado);
    return `<div class="card" style="padding:14px"><div class="row"><b>${esc(p.negocios?.nombre||'Comercio')}</b><span class="chip ${p.estado==='entregado'?'ok':fin?'no':''}">${ESTADOS[p.estado]}</span></div>
    <div class="meta">Pedido ${p.numero} · ${new Date(p.created_at).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
    <div style="margin:8px 0">${p.items.map(i=>`${i.cantidad} × ${esc(i.nombre)}`).join('<br>')}</div>
    <div class="row"><span class="meta">Total con envío</span><b>${money(p.total)}</b></div>
    ${p.estado==='pendiente'?`<button class="btn red" onclick="cancelar('${p.id}')">Cancelar pedido</button>`:''}</div>`}).join('');
}
async function cancelar(id){
  if(!confirm('¿Cancelar este pedido?'))return;
  const {error}=await sb.rpc('pedido_estado',{p_id:id,p_estado:'cancelado'});
  error?toast(error.message,1):renderPedidos();
}
init();
</script></body></html>
